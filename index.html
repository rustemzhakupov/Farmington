<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found]){display:none!important}</style></head><body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=Golos+Text:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
:root{
  --paper:#EDF0EC; --paper-2:#E3E8E3; --ink:#17201E; --muted:#5E6A67; --line:#C9D1CD;
  --lake:#1E6E7A; --lake-soft:#D6E7E9; --berry:#4B3F8F; --berry-soft:#DEDBF0; --reed:#B5893A; --reed-soft:#EFE3CC;
  --water:#BFD8DC; --land:#DCD6C4; --ok:#2E7D4F;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#101A19; --paper-2:#172423; --ink:#E6ECE9; --muted:#97A39F; --line:#2A3836;
    --lake:#5FC1CC; --lake-soft:#173A3F; --berry:#A69BE8; --berry-soft:#2B2750; --reed:#D8B26A; --reed-soft:#3A2F17;
    --water:#1D3C43; --land:#2C3128; --ok:#6FC392;
  }
}
:root[data-theme="dark"]{
  --paper:#101A19; --paper-2:#172423; --ink:#E6ECE9; --muted:#97A39F; --line:#2A3836;
  --lake:#5FC1CC; --lake-soft:#173A3F; --berry:#A69BE8; --berry-soft:#2B2750; --reed:#D8B26A; --reed-soft:#3A2F17;
  --water:#1D3C43; --land:#2C3128; --ok:#6FC392;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
html[lang="zh"] body{font-family:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif}
html[lang="zh"] h1,html[lang="zh"] h2,html[lang="zh"] h3{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;font-weight:700}
h1,h2,h3{font-family:"Unbounded","Golos Text",system-ui,sans-serif;font-weight:500;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(28px,4vw,44px)}
h2{font-size:clamp(22px,2.6vw,30px)}
h3{font-size:18px;font-weight:600;font-family:"Golos Text",system-ui,sans-serif}
p{margin:0}
a{color:var(--lake)}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
.label{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.lead{max-width:62ch;color:var(--ink)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* header */
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.1}
.brand b{font-family:"Unbounded",sans-serif;font-weight:600;font-size:18px;letter-spacing:.02em}
.brand span{font-size:12px;color:var(--muted)}
nav{display:flex;gap:14px;flex-wrap:wrap;font-size:13px}
nav a{color:var(--ink);text-decoration:none;border-bottom:1px solid transparent;padding-bottom:2px}
nav a:hover,nav a:focus-visible{border-color:var(--lake);outline:none}
.langs{display:flex;gap:4px;border:1px solid var(--line);border-radius:999px;padding:3px}
.langs button{font:inherit;font-size:13px;font-weight:500;background:none;border:0;border-radius:999px;padding:4px 11px;color:var(--muted);cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.langs button:focus-visible{outline:2px solid var(--lake);outline-offset:1px}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:48px;align-items:center;padding:64px 0 48px}
.hero .eyebrow{color:var(--lake);margin-bottom:18px}
.hero h1{margin-bottom:22px}
.hero .lead{font-size:18px;margin-bottom:28px}
.ctas{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-block;font:inherit;font-weight:500;font-size:15px;padding:11px 20px;border-radius:6px;text-decoration:none;border:1px solid var(--ink);color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn:focus-visible{outline:2px solid var(--lake);outline-offset:2px}
.map{width:100%;height:auto;display:block}
.legend{list-style:none;margin:10px 0 0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 16px;font-size:13px}
.legend li{display:flex;gap:8px;align-items:baseline}
.legend b{font-weight:600;width:14px;color:var(--lake)}
.map-cap{font-size:12px;color:var(--muted);margin-top:8px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* sections */
section{padding:56px 0;border-top:1px solid var(--line)}
.sec-head{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);gap:24px 48px;margin-bottom:32px;align-items:start}
.sec-head .label{margin-bottom:10px}

/* facts */
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.fact{padding:18px 18px 20px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.fact .label{color:var(--reed)}
.fact .v{font-size:16px;font-weight:500;line-height:1.35}

/* directions */
.dirs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.dir{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px 16px;padding:20px;border:1px solid var(--line);background:var(--paper-2);border-radius:8px}
.dir .ico{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;background:var(--lake-soft);color:var(--lake)}
.dir .ico svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dir .body{display:flex;flex-direction:column;gap:8px}
.dir h3{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chip{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--berry-soft);color:var(--berry)}
.chip.active{background:var(--lake-soft);color:var(--lake)}
.chip.infra{background:var(--reed-soft);color:var(--reed)}
.dir p{font-size:15px;color:var(--ink)}

/* dam */
.ba{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;margin-bottom:32px}
.ba figure,.xsec{margin:0}
.ba svg,.xsec svg{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:6px}
figcaption{margin-top:10px;font-size:14px;display:flex;flex-direction:column;gap:2px}
figcaption b{font-weight:600}
figcaption span{color:var(--muted)}
.sat svg{border:0;border-radius:6px}
.credit{font-size:12px;color:var(--muted)}
.sec-grid{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:24px 40px;align-items:start}
@media (max-width:860px){.ba,.sec-grid{grid-template-columns:1fr}}

/* land */
.land-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:32px 48px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 20px;font-size:15px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--ink)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.hi{color:var(--reed);font-weight:600}
td.ok{color:var(--ok);font-weight:600}
.foot{font-size:13px;color:var(--muted);margin-top:10px;max-width:70ch}
.stack{display:flex;flex-direction:column;gap:22px}

/* timeline */
.tl{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;border-top:2px solid var(--ink)}
.tl div{padding:16px 16px 0 0}
.tl b{display:block;font-family:"Unbounded",sans-serif;font-weight:500;font-size:20px;margin-bottom:8px;color:var(--lake)}
.tl p{font-size:14px}

/* partnership */
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.box{padding:24px;border:1px solid var(--line);border-radius:8px;background:var(--paper-2)}
.box h3{margin-bottom:14px}
.box ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:15px}
.note{margin-top:20px;padding:16px 20px;border-left:3px solid var(--reed);font-size:15px;max-width:70ch}

/* docs */
.docs{columns:2;column-gap:40px;margin:0;padding-left:20px;font-size:15px}
.docs li{break-inside:avoid;padding:4px 0}

/* contact */
.contact{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:32px 48px;align-items:start}
.card{border:1px solid var(--line);border-radius:8px;padding:24px;background:var(--paper-2);display:flex;flex-direction:column;gap:14px}
.card .who{font-family:"Unbounded",sans-serif;font-weight:500;font-size:20px}
.card .row{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:15px}
.card .row span{color:var(--muted)}
.card .row a{font-weight:500;text-decoration:none;border-bottom:1px solid var(--lake)}

footer{padding:32px 0 56px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
footer p{max-width:80ch}

@media (max-width:860px){
  .hero{grid-template-columns:1fr;gap:32px;padding-top:40px}
  .sec-head,.land-grid,.contact,.two{grid-template-columns:1fr}
  .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dirs{grid-template-columns:1fr}
  .tl{grid-template-columns:1fr;border-top:0;border-left:2px solid var(--ink)}
  .tl div{padding:0 0 16px 16px}
  .docs{columns:1}
  nav{display:none}
}

"dir.label":"Бағыттар","dir.title":"Бір алаңдағы сегіз бағыт","dir.lead":"Учаске толық циклді шаруашылық ретінде жоспарланған: су қоймасының суы аквамәдениет бассейндері арқылы өтіп, суаруға кетеді, бір бағыттың қалдығы екіншісіне шикізат болады, ал жағалау агротуризмге қызмет етеді. Серіктес бүкіл алаңға немесе жеке бағытқа кіре алады.",

const NAMES = {kk:"kk",ru:"ru",en:"en",zh:"zh"};
function apply(lang){
  if(!T[lang]) lang="ru";
  const d = T[lang];
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const k = el.getAttribute("data-i18n");
    if(d[k]!==undefined) el.textContent = d[k];
  });
  document.documentElement.lang = lang;
  document.querySelectorAll(".langs button").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.lang===lang)));
  try{ localStorage.setItem("fm-lang", lang); }catch(e){}
}
document.querySelectorAll(".langs button").forEach(b=>b.addEventListener("click",()=>apply(b.dataset.lang)));
(function(){
  let lang = null;
  try{ lang = localStorage.getItem("fm-lang"); }catch(e){}
  if(!lang){
    const h = new URLSearchParams(location.search).get("lang");
    if(h && T[h]) lang = h;
  }
  if(!lang){
    const nav = (navigator.language||"ru").toLowerCase();
    lang = nav.startsWith("kk")?"kk":nav.startsWith("zh")?"zh":nav.startsWith("en")?"en":"ru";
  }
  apply(lang);
})();
</script>
